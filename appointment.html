<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Appointment - Pankaj K. Soni</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { 
            background-color: #0f172a; 
            font-family: 'Merriweather', sans-serif; 
        }
        .container { 
            max-width: 480px; 
            margin: 2rem auto; 
            padding: 1rem; 
        }
        .card { 
            background: white; 
            border-radius: 1.25rem; 
            padding: 2rem; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
        }
        .slot {
            padding: 14px 20px;
            margin: 8px 0;
            border: 2px solid #e2e8f0;
            border-radius: 9999px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .slot:hover {
            border-color: #d4af37;
            background-color: #fffbeb;
        }
        .slot.booked {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #b91c1c;
            cursor: not-allowed;
            text-decoration: line-through;
        }
        .slot.selected {
            background-color: #d4af37;
            color: #1e293b;
            border-color: #d4af37;
            font-weight: 700;
        }
        .time-header {
            background: #1e293b;
            color: white;
            padding: 1rem;
            border-radius: 0.75rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="text-center mb-6">
                <span class="material-icons text-5xl text-amber-500 mb-2">event_available</span>
                <h1 class="text-2xl font-bold text-gray-800">Book Appointment</h1>
                <p class="text-gray-600 mt-1">Pankajkumar K. Soni<br>Advocate, Gujarat High Court</p>
            </div>

            <div class="time-header">
                <p class="text-sm opacity-90">Available Time Slots</p>
                <p class="text-lg font-semibold">9:00 AM - 5:00 PM</p>
            </div>

            <div id="slots" class="space-y-2">
                <!-- Slots will be generated by JavaScript -->
            </div>

            <div class="mt-8 text-center">
                <button onclick="confirmBooking()" 
                        class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 px-6 rounded-2xl text-lg transition-all">
                    Confirm Appointment
                </button>
                <p class="text-xs text-gray-500 mt-4">
                    Note: 12:00 PM - 1:00 PM is Lunch Break
                </p>
            </div>
        </div>

        <div class="text-center mt-6">
            <a href="index.html" class="text-amber-400 hover:text-amber-300 text-sm flex items-center justify-center gap-1">
                ← Back to Profile
            </a>
        </div>
    </div>

    <script>
        const slotsContainer = document.getElementById('slots');
        let selectedSlot = null;

        // Generate time slots: 9 AM to 5 PM, 1-hour slots, skip 12-1 PM
        function generateSlots() {
            slotsContainer.innerHTML = '';
            
            for (let hour = 9; hour <= 16; hour++) {  // 9 to 4 PM (since 4-5 is last slot)
                if (hour === 12) continue; // Skip 12:00 - 1:00 PM (Lunch Break)

                let timeStr;
                if (hour < 12) {
                    timeStr = `${hour}:00 AM - ${hour+1}:00 AM`;
                } else if (hour === 12) {
                    timeStr = `12:00 PM - 1:00 PM`; // This is skipped anyway
                } else {
                    const endHour = hour + 1 === 13 ? 1 : hour + 1;
                    timeStr = `${hour}:00 PM - ${endHour}:00 PM`;
                }

                const slotDiv = document.createElement('div');
                slotDiv.className = 'slot';
                slotDiv.textContent = timeStr;
                slotDiv.dataset.time = timeStr;

                // Simulate some already booked slots (you can connect to backend later)
                const bookedSlots = ["10:00 AM - 11:00 AM", "2:00 PM - 3:00 PM"];
                if (bookedSlots.includes(timeStr)) {
                    slotDiv.classList.add('booked');
                } else {
                    slotDiv.addEventListener('click', () => selectSlot(slotDiv));
                }

                slotsContainer.appendChild(slotDiv);
            }
        }

        function selectSlot(slotElement) {
            // Deselect all
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
            
            // Select this one
            slotElement.classList.add('selected');
            selectedSlot = slotElement.dataset.time;
        }

        function confirmBooking() {
            if (!selectedSlot) {
                alert("Please select a time slot first.");
                return;
            }
            
            alert(`✅ Appointment Confirmed!\n\nTime: ${selectedSlot}\n\nYou will receive confirmation on WhatsApp shortly.`);
            
            // Here you can later add WhatsApp message or form submission
            // Example:
            // window.open(`https://wa.me/919274514892?text=Appointment%20booked%20for%20${encodeURIComponent(selectedSlot)}`, '_blank');
        }

        // Initialize slots when page loads
        window.onload = generateSlots;
    </script>
</body>
</html>
